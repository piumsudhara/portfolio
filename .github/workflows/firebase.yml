name: Firebase CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools
          echo $FIREBASE_SERVICE_ACCOUNT > $HOME/firebase_key.json
          firebase deploy --project pium95 --token "$(firebase login:ci --no-localhost)" --debug
        env:
          FIREBASE_DEPLOY_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          CI: false
