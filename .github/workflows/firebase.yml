name: Firebase CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install -g yarn
      - name: yarn install, build and test
        run: |
          yarn install
          yarn build
      - name: Archive Build
        uses: actions/upload-artifact@v2
        with:
          name: build
          path: build

      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools
          echo $FIREBASE_SERVICE_ACCOUNT > $HOME/firebase_key.json
          firebase deploy --project pium95 --token "$(firebase login:ci --no-localhost)" --debug
        env:
          FIREBASE_DEPLOY_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          CI: false
