name: Firebase CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.x]
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install -g yarn
      - name: yarn install, build and test
        run: |
          yarn install
          yarn build
      - name: Archive Build
        uses: actions/upload-artifact@v2
        with:
          name: build
          path: build
        
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Download Build
        uses: actions/download-artifact@v2
        with:
          name: build
          path: build
      - name: Authenticate with Firebase
        env:
          FIREBASE_DEPLOY_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_DEPLOY_KEY" > $HOME/firebase_key.json
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest
      - name: Deploy to Firebase
        run: |
          firebase deploy --project pium95 --only hosting --token "$(cat $HOME/firebase_key.json)" --debug
